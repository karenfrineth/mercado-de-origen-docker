name: mercado-de-origen
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    environment:
      BASE_URL: http://backend:8000/api
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Configura APP_KEY}
      APP_URL: ${API_ORIGIN:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-mercado}
      DB_USERNAME: ${MYSQL_USER:-mercado}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      LOG_CHANNEL: stderr
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/products"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [web, datos]
    restart: unless-stopped

  mysql:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mercado}
      MYSQL_USER: ${MYSQL_USER:-mercado}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [datos]
    restart: unless-stopped

volumes:
  mysql_data:
networks:
  web:
  datos:
    internal: true
